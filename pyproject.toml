[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretservice-mail"
version = "0.1.0"
description = "Covert messaging over email and memes: sealed-box encrypted payloads hidden in ordinary-looking mail and images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "secretservice contributors" }]
keywords = ["steganography", "email", "encryption", "nacl", "covert"]
dependencies = [
    "pynacl>=1.5",
    "pillow>=9",
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
ss = "secretservice.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR-ORG/secretservice"

[tool.setuptools.packages.find]
include = ["secretservice*"]
